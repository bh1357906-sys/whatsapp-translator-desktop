plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bh.watranslator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bh.watranslator'
        minSdk 26
        targetSdk 35
        versionCode 601
        versionName '0.6.1'
    }

    signingConfigs {
        release {
            // 固定签名，保证以后的新版本能直接覆盖安装
            storeFile file('release.keystore')
            storePassword 'watranslator'
            keyAlias 'watranslator'
            keyPassword 'watranslator'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
