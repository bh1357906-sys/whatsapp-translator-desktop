name: android

# 打 android-v* 标签时自动编译 APK 并发布；也可以在 Actions 页面手动运行
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 编译 APK
        working-directory: android
        run: |
          # GitHub 的 Ubuntu 机器自带安卓 SDK，这里只补装需要的平台版本
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" > /dev/null
          gradle --no-daemon :app:assembleRelease
          VER=$(grep versionName app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/wa-translator-android-$VER.apk
          ls -la ../dist-apk
      - uses: actions/upload-artifact@v4
        with:
          name: wa-translator-android
          path: dist-apk/*.apk
      # make_latest: false —— 不抢电脑版的“Latest”，否则电脑版自动更新会找不到 latest.yml
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 安卓版 ${{ github.ref_name }}
          make_latest: 'false'
          body: |
            安卓版（WhatsApp 悬浮翻译）。下载下面的 APK 安装到手机。
            安装后打开「WA 翻译助手」，按页面提示开启无障碍服务、填写 API Key。
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
