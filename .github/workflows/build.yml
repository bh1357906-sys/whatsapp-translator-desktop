name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 用锁文件精确安装，保证每次构建的依赖版本一致
      - run: npm ci
      - name: 语法检查 + 打包 preload + 单元测试
        shell: bash
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
          npm test
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: wa-translator-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      # 自动更新需要 latest.yml 和 .blockmap 一起上传到 Release
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Chrome 插件：需要 Telegram 项目放在旁边（build.js 从 ../telegram-translator-desktop 取 TG 的页面适配器）
  build-ext:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: whatsapp-translator-desktop
      - uses: actions/checkout@v4
        with:
          repository: bh1357906-sys/telegram-translator-desktop
          ref: main
          path: telegram-translator-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 打包插件
        shell: bash
        working-directory: whatsapp-translator-desktop
        run: |
          node extension/build.js ../translator-chrome-extension
          VER=$(node -p "require('./package.json').version")
          cd ..
          zip -r "translator-chrome-extension-$VER.zip" translator-chrome-extension
          echo "ZIP=translator-chrome-extension-$VER.zip" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: translator-chrome-extension
          path: ${{ env.ZIP }}
      # 打标签时挂到同一个 Release；手动运行时挂到 package.json 版本对应的 Release（v<版本>）
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VER) }}
          files: ${{ env.ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
